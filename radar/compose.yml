services:
  radar:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8768:8768"
    env_file:
      - ./radar.env
    command: ["--host", "0.0.0.0", "--port", "8768", "--cache", "/var/lib/radar-demo/native", "--source-cache", "/var/lib/radar-demo/source", "--token-env", "VPS_TOKEN"]
    volumes:
      - radar-data:/var/lib/radar-demo
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  radar-data:
