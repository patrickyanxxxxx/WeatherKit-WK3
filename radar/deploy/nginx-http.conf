server {
    listen 80;
    listen [::]:80;
    server_name radar.example.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/radar-demo;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
