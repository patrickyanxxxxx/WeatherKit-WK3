server {
    listen 80;
    listen [::]:80;
    server_name radar.example.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/radar-demo;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radar.example.com;
    ssl_certificate /etc/nginx/certs/radar-demo/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/radar-demo/key.pem;
    access_log off;
    location = /status {
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 30s;
    }
    location = /v1/radar {
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
